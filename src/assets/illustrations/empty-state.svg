<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" aria-label="Empty state illustration">
  <defs>
    <linearGradient id="emptyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d2ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#7b2cbf;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="emptyGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background film strip -->
  <rect x="80" y="40" width="240" height="180" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  
  <!-- Film perforations -->
  <g fill="rgba(255,255,255,0.1)">
    <rect x="95" y="55" width="12" height="8" rx="2"/>
    <rect x="95" y="75" width="12" height="8" rx="2"/>
    <rect x="95" y="95" width="12" height="8" rx="2"/>
    <rect x="95" y="115" width="12" height="8" rx="2"/>
    <rect x="95" y="135" width="12" height="8" rx="2"/>
    <rect x="95" y="155" width="12" height="8" rx="2"/>
    <rect x="95" y="175" width="12" height="8" rx="2"/>
    <rect x="95" y="195" width="12" height="8" rx="2"/>
    
    <rect x="293" y="55" width="12" height="8" rx="2"/>
    <rect x="293" y="75" width="12" height="8" rx="2"/>
    <rect x="293" y="95" width="12" height="8" rx="2"/>
    <rect x="293" y="115" width="12" height="8" rx="2"/>
    <rect x="293" y="135" width="12" height="8" rx="2"/>
    <rect x="293" y="155" width="12" height="8" rx="2"/>
    <rect x="293" y="175" width="12" height="8" rx="2"/>
    <rect x="293" y="195" width="12" height="8" rx="2"/>
  </g>
  
  <!-- Central play button circle -->
  <circle cx="200" cy="130" r="36" fill="none" stroke="url(#emptyGradient)" stroke-width="3" filter="url(#emptyGlow)">
    <animate attributeName="r" values="36;40;36" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Play triangle -->
  <path d="M190 115 L190 145 L215 130 Z" fill="url(#emptyGradient)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </path>
  
  <!-- Floating particles -->
  <circle cx="120" cy="100" r="3" fill="#00d2ff" opacity="0.6">
    <animate attributeName="cy" values="100;90;100" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="160" r="2" fill="#7b2cbf" opacity="0.5">
    <animate attributeName="cy" values="160;150;160" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="200" r="2.5" fill="#ec4899" opacity="0.4">
    <animate attributeName="cy" values="200;190;200" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Text -->
  <text x="200" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="rgba(255,255,255,0.5)">
    No content yet
  </text>
  <text x="200" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="rgba(255,255,255,0.3)">
    Start exploring to add items here
  </text>
</svg>