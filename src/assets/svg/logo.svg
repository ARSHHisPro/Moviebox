<svg viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg" aria-label="MovieBox Premium Logo">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E50914"/>
      <stop offset="50%" style="stop-color:#7B2FBE"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00D4FF" flood-opacity="0.5"/>
    </filter>
  </defs>
  <g filter="url(#logoGlow)">
    <text x="20" y="52" font-family="'Poppins', 'Inter', system-ui, sans-serif" font-size="44" font-weight="800" fill="url(#logoGradient)" letter-spacing="-1">
      MovieBox
    </text>
    <rect x="18" y="58" width="264" height="3" fill="url(#logoGradient)" rx="1.5">
      <animate attributeName="width" values="0;264;264;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="275" cy="38" r="7" fill="#E50914" filter="url(#logoShadow)">
      <animate attributeName="r" values="7;10;7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>